name: user_communication_style
version: 1

prompt: |
  You are analyzing a user's communication style from their messages.

  Below are examples of messages written by the user. Infer patterns ONLY from
  the text provided. Do not rely on memory, previous conversations, or assumed
  user preferences.

  Analyze:
  1. Formality
  2. Directness
  3. Warmth
  4. Verbosity
  5. Sentence style
  6. Greeting style
  7. Request style
  8. Vocabulary style
  9. Humor
  10. Emoji usage
  11. Common phrases
  12. Writing habits
  13. Things the user appears to prefer
  14. Things the user appears to avoid
  15. Personality signals that are reasonably supported by the messages

  For every inferred value, provide a short evidence-based explanation.

  If there is not enough evidence for a field, use null rather than guessing.

  Return ONLY valid JSON using the following structure:

  {
    "communication_style": {
      "formality": null,
      "directness": null,
      "warmth": null,
      "verbosity": null,
      "sentence_style": null,
      "greeting_style": null,
      "request_style": null,
      "vocabulary_style": null,
      "humor": null,
      "emoji_usage": null
    },
    "patterns": {
      "common_phrases": [],
      "writing_habits": []
    },
    "preferences": {
      "prefer": [],
      "avoid": []
    },
    "personality_signals": []
  }

  USER MESSAGES:

  1. "I like the idea, of that. do you make the status, part of it as well? like the class of the bright data why did you add the gemini there"

  2. "ahh, makes sense."

  3. "can you provide a much better, flow to read and follow. I can't remember all of this, I have understood. but I want to make the files, from the terminal here and then proced"

  4. "so, fuck It I can make the apis. and then rest, is future guatam job to research figure the process, and the calling of things and shit. done."

  5. "I think there could be service, enrichment, because, or what was it routes service and the other, one."

  Do not correct the user's grammar or spelling. Analyze how they actually communicate.

side_note: |
  Infer only from the provided messages. Prefer null over guessing.
  Communication style is different from personality.
  More diverse user messages generally produce better results.

questions:
  - id: formality
    question: "When you talk to people, which style feels most natural to you?"
    options:
      - "Very casual"
      - "Casual"
      - "Neutral"
      - "Formal"

  - id: directness
    question: "How do you usually prefer people to communicate with you?"
    options:
      - "Very directly"
      - "Directly"
      - "Balanced"
      - "Gently"

  - id: verbosity
    question: "When someone explains something to you, what do you prefer?"
    options:
      - "Very brief"
      - "Short with examples"
      - "Detailed"
      - "Very detailed"

  - id: warmth
    question: "What tone feels most natural when communicating?"
    options:
      - "Friendly and warm"
      - "Casual and neutral"
      - "Professional"
      - "Direct and practical"

  - id: humor
    question: "How much humor do you normally use when communicating?"
    options:
      - "Almost never"
      - "Sometimes"
      - "Often"
      - "A lot"

  - id: greeting_style
    question: "How do you normally start conversations?"
    options:
      - "Usually no greeting"
      - "Short/casual greeting"
      - "Friendly greeting"
      - "Formal greeting"

fallback:
  condition: "Use questions only when important output fields cannot be reasonably inferred."
  strategy: "Ask only the minimum number of questions needed to fill missing information."
  do_not_ask: "Do not ask the user about fields that can already be inferred with reasonable confidence."
