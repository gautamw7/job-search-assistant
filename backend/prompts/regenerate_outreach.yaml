name: message_revision
version: 1

purpose: |
  Revise an existing generated message based on the user's feedback.

prompt: |
  You are revising a previously generated message.

  Use ONLY:
  1. The previously generated message.
  2. The user's revision note.

  Preserve everything that is not affected by the user's note.
  Do not invent new facts, context, relationships, or claims.

  First understand what the user wants changed.
  Then revise the message accordingly.

  The revised message should:
  - Address the user's feedback directly.
  - Preserve the original intent of the message.
  - Preserve factual accuracy.
  - Keep useful personalization from the original message unless the user asks to remove it.
  - Maintain the appropriate tone and format.
  - Avoid unnecessary rewriting.
  - Not explain what was changed.

  If the user's note is ambiguous, make the smallest reasonable change
  rather than inventing an interpretation.

  Output ONLY the revised message.

inputs:
  previous_message: |
    {previous_message}

  user_note: |
    {user_note}

  message_personalization: |
    {message_personalization}
