version: 1

disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S UTC"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: INFO
    formatter: standard
    filename: ""
    encoding: utf-8

loggers:
  backend:
    level: INFO
    handlers:
      - console
      - file
    propagate: false

  uvicorn:
    level: INFO
    handlers:
      - console
      - file
    propagate: false

root:
  level: INFO
  handlers:
    - console
    - file
