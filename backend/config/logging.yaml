version: 1
disable_existing_loggers: false

formatters:
  detailed:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  simple:
    format: "%(levelname)s | %(name)s | %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: detailed
    stream: ext://sys.stdout

  app_file:
    class: logging.handlers.TimedRotatingFileHandler
    level: DEBUG
    formatter: detailed
    # filename is set dynamically by services/logger.py to logs/YYYY/MM/DD/app.log
    filename: logs/app.log
    when: midnight
    backupCount: 14
    encoding: utf-8
    utc: false

  error_file:
    class: logging.handlers.TimedRotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/error.log
    when: midnight
    backupCount: 14
    encoding: utf-8
    utc: false

loggers:
  job_search:
    level: DEBUG
    handlers: [console, app_file, error_file]
    propagate: false
  uvicorn:
    level: INFO
    handlers: [console, app_file]
    propagate: false
  uvicorn.error:
    level: INFO
    handlers: [console, app_file, error_file]
    propagate: false
  uvicorn.access:
    level: INFO
    handlers: [console, app_file]
    propagate: false

root:
  level: INFO
  handlers: [console, app_file, error_file]
