user_profile:
  personality_markdown: TEXT NOT NULL
  resume_markdown: TEXT NOT NULL
  updated_at: TIMESTAMP DEFAULT CURRENT_TIMESTAMP

provider_config:
  config_id: INTEGER PRIMARY KEY AUTOINCREMENT
  provider_name: TEXT NOT NULL UNIQUE
  credential_name: TEXT NOT NULL
  is_active: INTEGER NOT NULL DEFAULT 1
  created_at: TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  updated_at: TIMESTAMP DEFAULT CURRENT_TIMESTAMP

api_status:
  status_id: INTEGER PRIMARY KEY AUTOINCREMENT
  provider_name: TEXT NOT NULL
  status: TEXT NOT NULL
  status_code: INTEGER
  response_time_ms: REAL
  error_message: TEXT
  last_checked_at: TIMESTAMP DEFAULT CURRENT_TIMESTAMP

connections:
  connection_id: INTEGER PRIMARY KEY AUTOINCREMENT
  linkedin_url: TEXT NOT NULL
  first_name: TEXT
  last_name: TEXT
  company: TEXT
  position: TEXT
  email: TEXT
  is_enriched: INTEGER DEFAULT 0
  imported_at: TIMESTAMP DEFAULT CURRENT_TIMESTAMP

people:
  linkedin_url: TEXT NOT NULL PRIMARY KEY
  name: TEXT
  headline: TEXT
  company: TEXT
  location: TEXT
  about: TEXT
  connected: INTEGER DEFAULT 0
  created_at: TIMESTAMP DEFAULT CURRENT_TIMESTAMP

# Would require MAX(created_at) for each person_id to get the latest enrichment record
enrichments:
  enrichment_id: INTEGER PRIMARY KEY AUTOINCREMENT
  linkedin_url: TEXT NOT NULL REFERENCES people(linkedin_url)
  provider_name: TEXT NOT NULL
  raw_response: TEXT
  status: TEXT NOT NULL
  error_message: TEXT
  created_at: TIMESTAMP DEFAULT CURRENT_TIMESTAMP

# Same
outreach_messages:
  message_id: INTEGER PRIMARY KEY AUTOINCREMENT
  linkedin_url: TEXT NOT NULL REFERENCES people(linkedin_url)
  generated_text: TEXT NOT NULL
  final_text: TEXT
  user_context: TEXT
  generated_at: TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  finalized_at: TIMESTAMP
