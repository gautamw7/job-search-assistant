# Gemini models, tried in order until one succeeds.
# Free-tier models come first so the default "free tier assumed" setup really is
# free (checked against https://aistudio.google.com/docs/pricing, Nov 2026).
# Models that may be billed stay at the end as fallbacks.
gemini:
  models:
    - gemini-3.6-flash        # free tier
    - gemini-3.8-flash        # free tier
    - gemini-3.5-flash-lite   # free tier
    - gemini-3.5-flash        # may be billed
    - gemini-3.7-flash        # may be billed

# Embeddings for job matching (phase 2). Free on the standard tier.
embedding:
  model: gemini-embedding-2
  dimensions: 768
