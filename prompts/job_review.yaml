name: job_review
version: 1

# Filled with str.format: literal braces are doubled.
prompt: |
  You are a candid career advisor. For each JOB below, judge how well it fits this CANDIDATE.

  CANDIDATE PROFILE
  {profile}

  CANDIDATE RESUME
  {resume}

  For every job return:
  - "fit": 0-100. Realistic chance this candidate is a good, hireable fit given their actual
    experience and seniority (not just topic overlap). Penalize roles far above their level.
  - "reasons": 1-3 short, specific reasons (mention concrete skills/experience).
  - "missing_skills": up to 4 important requirements the resume does not show.
  - "german_required": "yes" if the posting requires German, "no" if it says English is enough
    or is clearly English-only, "unclear" otherwise.
  - "german_level": CEFR level required if stated or implied ("fluent" ≈ "C1"), else "".
  - "sponsorship": "yes" if visa sponsorship/relocation support is offered, "no" if it says
    no sponsorship / must already have work authorization, "unclear" otherwise.
  - "company_kind": "startup", "scaleup", "enterprise" or "unknown" (your best guess from the
    company name and description).

  Use only the job text; do not invent details. Return JSON only:
  {{"reviews": [{{"id": "", "fit": 0, "reasons": [""], "missing_skills": [""],
    "german_required": "unclear", "german_level": "", "sponsorship": "unclear",
    "company_kind": "unknown"}}]}}

  JOBS
  {jobs}
