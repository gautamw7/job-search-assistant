<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Search Assistant - Workspace</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #080b12;
            --panel: #101621;
            --panel-2: #0c111a;
            --border: rgba(148, 163, 184, .13);
            --border-strong: rgba(148, 163, 184, .22);
            --text: #e8edf5;
            --muted: #8b97aa;
            --muted-2: #647084;
            --accent: #34d399;
            --accent-2: #22d3ee;
            --danger: #fb7185;
        }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
        body {
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 15% -10%, rgba(34,211,238,.07), transparent 32rem),
                radial-gradient(circle at 85% 0%, rgba(52,211,153,.055), transparent 30rem),
                var(--bg) !important;
        }
        .app-shell { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .app-topbar {
            height: 64px; flex: 0 0 64px; padding: 0 28px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(8,11,18,.82); backdrop-filter: blur(18px); z-index: 20;
        }
        .brand, .topbar-right { display: flex; align-items: center; }
        .brand { gap: 11px; }
        .brand-mark {
            width: 32px; height: 32px; display: grid; place-items: center;
            border-radius: 9px; color: #06110d; font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 28px rgba(52,211,153,.14);
        }
        .brand-name { font-size: 13px; font-weight: 750; }
        .brand-subtitle { color: var(--muted-2); font-size: 10px; margin-top: 1px; }
        .topbar-right { gap: 8px; color: var(--muted); font-size: 11px; }
        .connection-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(52,211,153,.10); }
        .connection-dot.offline { background: var(--danger); box-shadow: 0 0 0 3px rgba(251,113,133,.10); }
        .app-main {
            flex: 1; min-height: 0; overflow: hidden;
            width: 100%; padding: 22px 28px;
            display: flex; flex-direction: column;
        }
        #spa-container {
            width: 100%; max-width: 1440px; margin: 0 auto;
            flex: 1; min-height: 0; display: flex; overflow: hidden;
        }
        .app-footer {
            flex: 0 0 auto; padding: 12px 28px;
            border-top: 1px solid var(--border); color: var(--muted-2);
            font-size: 10px; display: flex; gap: 7px; justify-content: center;
        }
        .app-view {
            width: 100%; min-height: 0; height: 100%; overflow: hidden;
            background: linear-gradient(180deg, rgba(16,22,33,.98), rgba(13,18,27,.98)) !important;
            border: 1px solid var(--border-strong) !important;
            border-radius: 18px !important;
            box-shadow: 0 18px 60px rgba(0,0,0,.24), inset 0 1px rgba(255,255,255,.025);
            max-width: none !important;
            padding: 26px !important;
        }
        .view-inner { height: 100%; min-height: 0; display: flex; flex-direction: column; }
        input, textarea, select { transition: border-color .16s ease, box-shadow .16s ease, background .16s ease; }
        input:focus, textarea:focus, select:focus { box-shadow: 0 0 0 3px rgba(52,211,153,.08) !important; border-color: rgba(52,211,153,.5) !important; }
        select {
            background-color: #0f172a !important; color: #e2e8f0 !important;
            border: 1px solid rgba(148, 163, 184, 0.22) !important;
        }
        option { background-color: #0f172a !important; color: #e2e8f0 !important; }
        .app-toast {
            position: fixed; right: 22px; bottom: 22px; z-index: 100;
            max-width: 360px; padding: 11px 14px; border: 1px solid rgba(52,211,153,.25);
            border-radius: 10px; background: rgba(15,23,42,.96); color: #dce7f3;
            font-size: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.4);
            opacity: 0; transform: translateY(8px); pointer-events: none;
            transition: opacity .18s ease, transform .18s ease;
        }
        .app-toast.visible { opacity: 1; transform: translateY(0); }
        .app-toast[data-type="error"] { border-color: rgba(251,113,133,.3); }
        code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
</head>
<body class="min-h-screen">
    <div class="app-shell">
        <header class="app-topbar">
            <div class="brand">
                <div class="brand-mark">J</div>
                <div>
                    <div class="brand-name">Job Search Assistant</div>
                    <div class="brand-subtitle">Personal outreach workspace</div>
                </div>
            </div>
            <div class="topbar-right">
                <div class="flex items-center gap-2 mr-2">
                    <button id="nav-btn-targets" class="px-2.5 py-1 text-xs font-semibold text-slate-300 hover:text-white rounded-lg border border-slate-700 bg-slate-900/80 hover:border-cyan-500/50 transition cursor-pointer">🎯 Targets</button>
                    <button id="nav-btn-workspace" class="px-2.5 py-1 text-xs font-semibold text-slate-300 hover:text-white rounded-lg border border-slate-700 bg-slate-900/80 hover:border-cyan-500/50 transition cursor-pointer">📊 Workspace</button>
                    <button id="nav-btn-profile" class="px-2.5 py-1 text-xs font-semibold text-slate-300 hover:text-white rounded-lg border border-slate-700 bg-slate-900/80 hover:border-emerald-500/50 transition flex items-center gap-1 cursor-pointer">
                        <span>👤 Profile Settings</span>
                    </button>
                </div>
                <span class="connection-dot"></span>
                <span id="backend-status">Connecting...</span>
            </div>
        </header>
        <main class="app-main">
            <div id="spa-container" class="w-full max-w-6xl"></div>
        </main>
        <footer class="app-footer">
            <span>Job Search Assistant</span>
            <span>•</span>
            <span>Drafts stay in your local workspace</span>
        </footer>
    </div>
    <!-- Modular ES Module Entrypoint -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
